name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restaurar dependências
        run: dotnet restore src/AgroConecta/AgroConecta/AgroConecta.csproj

      - name: Compilar projeto
        run: dotnet build src/AgroConecta/AgroConecta/AgroConecta.csproj --configuration Release --no-restore
